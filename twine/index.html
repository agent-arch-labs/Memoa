<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memoa</title>
    <style>
      :root {
        --color-surface: #ffffff;
        --color-surface-secondary: #f8f9fa;
        --color-surface-hover: #f1f3f5;
        --color-border: #e9ecef;
        --color-text-primary: #212529;
        --color-text-secondary: #495057;
        --color-text-muted: #868e96;
        --color-accent: #4a9eff;
        --color-accent-hover: #3b8ce8;
      }
      .dark {
        --color-surface: #1a1b1e;
        --color-surface-secondary: #25262b;
        --color-surface-hover: #2c2e33;
        --color-border: #373a40;
        --color-text-primary: #c1c2c5;
        --color-text-secondary: #909296;
        --color-text-muted: #5c5f66;
        --color-accent: #4a9eff;
        --color-accent-hover: #6cb2ff;
      }
      html, body, #root {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
      body {
        font-family: "Inter", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
        background: var(--color-surface);
        color: var(--color-text-primary);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
