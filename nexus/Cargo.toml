[package]
name = "nexus"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Nexus — Memoa Cloud Sync Hub & AI Gateway"

[[bin]]
name = "nexus"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
uuid = { version = "1", features = ["v4", "v7"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-http = { version = "0.5", features = ["cors", "trace", "limit", "timeout"] }
tower = { version = "0.4", features = ["limit", "buffer", "util"] }
jsonwebtoken = "9"
argon2 = "0.5"
dotenvy = "0.15"
rand = "0.8"
hex = "0.4"
bytes = "1"
futures-util = "0.3"
mime_guess = "2"
base64 = "0.22"
url = "2"

[dev-dependencies]
axum-test = "15"
tempfile = "3"
http-body-util = "0.1"